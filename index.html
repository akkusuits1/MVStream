<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="MVStream - Watch Movies & Web Series Online for Free. Stream HD movies, TV shows, and web series without signup." />
  <meta name="keywords" content="watch movies online, free movies, web series, streaming, HD movies, TV shows, movie streaming, watch series online" />
  <meta name="author" content="MVStream" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MVStream" />
  <meta name="application-name" content="MVStream" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="MVStream - Watch Movies & Series Online for Free" />
  <meta property="og:description" content="Stream HD movies, web series, and TV shows online for free. No signup required." />
  <meta property="og:site_name" content="MVStream" />
  <meta property="og:url" content="https://akkusuits1.github.io/MVStream/" />
  <meta property="og:image" content="https://akkusuits1.github.io/MVStream/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="MVStream - Watch Movies & Series Online for Free" />
  <meta name="twitter:description" content="Stream HD movies, web series, and TV shows online for free. No signup required." />
  <meta name="twitter:image" content="https://akkusuits1.github.io/MVStream/og-image.png" />

  <title>MVStream - Watch Movies & Series Online for Free</title>

  <!-- Canonical URL -->
  <link rel="canonical" href="https://akkusuits1.github.io/MVStream/" />

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fonts: Inter -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Critical CSS (inlined for LCP) -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0A0A0A;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A0A0A;
      z-index: 9999;
    }
    .app-loader__spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(229, 9, 20, 0.2);
      border-top-color: #E50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "MVStream",
    "url": "https://akkusuits1.github.io/MVStream/",
    "description": "Watch Movies & Web Series Online for Free",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://akkusuits1.github.io/MVStream/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "MVStream",
    "url": "https://akkusuits1.github.io/MVStream/",
    "logo": "https://akkusuits1.github.io/MVStream/favicon.svg"
  }
  </script>
</head>
<body>
  <div id="root">
    <div class="app-loader">
      <div class="app-loader__spinner"></div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
