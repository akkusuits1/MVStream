<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MVStream</title>
    <script>
      // GitHub Pages SPA redirect
      // Saves the 404 path and redirects to index.html which restores it
      var pathSegmentsToKeep = 1; // number of path segments to keep ("/MVStream")
      var origin = location.origin + location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var path = location.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var search = location.search ? location.search : '';
      var hash = location.hash ? location.hash : '';

      sessionStorage.setItem('redirect', path + search + hash);
      location.replace(origin + '/');
    </script>
  </head>
  <body></body>
</html>
